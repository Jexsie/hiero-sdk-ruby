name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  spec:
    name: spec (ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Support runs from 3.2 (the floor our dependencies impose, and where
        # Data.define arrives) up to the latest release. Development happens on
        # the newest; CI is what proves the floor has not quietly rotted.
        ruby: ["3.2", "3.3", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake spec

  # The SDK's cryptography is written to need no native gem. This job removes the
  # optional one so the pure-Ruby keccak path is what actually gets tested, rather
  # than being shadowed by a faster implementation that happens to be installed.
  no-native-crypto:
    name: crypto works with no optional native gem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - run: gem install zeitwerk rspec --no-document
      - run: rspec --require spec_helper -Isdk/spec -Isdk/lib --pattern 'sdk/spec/**/*_spec.rb'

  # Talks to a real consensus node. hiero-solo-action stands one up in the runner
  # and hands back a funded account to pay with.
  #
  # Pinned to a released tag: the action deploys a whole network, so an unpinned
  # reference would let an upstream change break this repository's CI with no
  # commit here.
  integration:
    name: integration (live network)
    runs-on: ubuntu-latest
    # Deploying a network takes minutes and can wedge. Without a cap a stuck
    # deployment holds a runner for the six-hour default.
    timeout-minutes: 30
    # Nothing here writes to the repository or needs a token beyond checkout.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Start a Hiero network
        id: solo
        uses: hiero-ledger/hiero-solo-action@v0.24.0
        with:
          installMirrorNode: true

      - name: Run the integration specs
        run: bundle exec rake spec:integration
        env:
          # The action's defaults; named explicitly so a change upstream shows up
          # here as a failing job rather than as specs that quietly skip.
          HIERO_NODE_ADDRESS: localhost:35211
          HIERO_NODE_ACCOUNT: "0.0.3"
          HIERO_MIRROR_REST: http://localhost:38081
          HIERO_OPERATOR_ID: ${{ steps.solo.outputs.accountId }}
          HIERO_OPERATOR_KEY: ${{ steps.solo.outputs.privateKey }}
          # Turns "no network" from a skip into a failure. Without this a solo
          # deployment that failed to come up would leave every integration spec
          # skipped and the job green.
          HIERO_REQUIRE_NETWORK: "1"

  protos:
    name: generated output is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      # Regenerates from the vendored .proto sources and fails if the result
      # differs from what is committed. This is why grpc-tools is pinned in the
      # Gemfile: a different protoc produces a different diff.
      - run: bundle exec rake protos:check

  package:
    name: gem builds and installs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rake build build_sdk
      # Building a gem and installing one are different things: a gem can build
      # cleanly and still be uninstallable. Install them outside the checkout and
      # require them with no load path help, the way a consumer would.
      - name: install and require the built gems
        run: |
          gem install pkg/hiero-proto.gem pkg/hiero-sdk.gem --no-document
          cd "$(mktemp -d)"
          ruby -e '
            require "hiero/proto"
            raise "no CryptoService stub" unless defined?(Proto::CryptoService::Stub)
            raise "no mirror ConsensusService" unless
              Com::Hedera::Mirror::Api::Proto::ConsensusService::Service.rpc_descs.key?(:subscribeTopic)

            require "hiero"
            # Exercises the packaged word list, which lives outside lib/**/*.rb and
            # is the easiest thing to leave out of the gem.
            key = Hiero::Mnemonic.generate.to_standard_ed25519_private_key
            raise "signing broken" unless key.public_key.verify(key.sign("x"), "x")

            puts "hiero-proto #{Hiero::Proto::VERSION} and hiero-sdk #{Hiero::VERSION} install and load"
          '
